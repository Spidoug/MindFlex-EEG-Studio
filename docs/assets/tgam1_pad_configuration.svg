<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">TGAM1 startup pad configuration for MindFlex EEG Studio</title>
  <desc id="desc">Abstract diagram showing the BR1, BR0, and M configuration pads. The recommended MindFlex EEG Studio configuration is BR1 tied to VCC, BR0 tied to GND, and M tied to VCC for a 60 Hz notch filter.</desc>
  <rect width="1200" height="650" fill="#f7f8fb"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">TGAM1 startup pads — MindFlex EEG Studio</text>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="20" fill="#536174">Target: 57.6 kbaud + RAW waveform output. Top reference = GND; bottom reference = VCC.</text>

  <rect x="60" y="150" width="700" height="420" rx="24" fill="#ffffff" stroke="#ccd4df" stroke-width="2"/>
  <text x="90" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Abstract pad view (verify orientation on your board revision)</text>

  <text x="110" y="255" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#536174">GND reference</text>
  <line x1="250" y1="248" x2="690" y2="248" stroke="#536174" stroke-width="3"/>
  <text x="110" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#536174">VCC reference</text>
  <line x1="250" y1="498" x2="690" y2="498" stroke="#536174" stroke-width="3"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="350" y="300" font-size="22" font-weight="700" fill="#172033">BR1</text>
    <circle cx="350" cy="350" r="24" fill="#ffffff" stroke="#8a99aa" stroke-width="3"/>
    <circle cx="350" cy="445" r="24" fill="#1f6feb" stroke="#1556b3" stroke-width="3"/>
    <line x1="350" y1="469" x2="350" y2="498" stroke="#1f6feb" stroke-width="8" stroke-linecap="round"/>
    <text x="350" y="540" font-size="18" font-weight="700" fill="#1f6feb">VCC</text>

    <text x="500" y="300" font-size="22" font-weight="700" fill="#172033">BR0</text>
    <circle cx="500" cy="350" r="24" fill="#1f6feb" stroke="#1556b3" stroke-width="3"/>
    <circle cx="500" cy="445" r="24" fill="#ffffff" stroke="#8a99aa" stroke-width="3"/>
    <line x1="500" y1="326" x2="500" y2="248" stroke="#1f6feb" stroke-width="8" stroke-linecap="round"/>
    <text x="500" y="540" font-size="18" font-weight="700" fill="#1f6feb">GND</text>

    <text x="650" y="300" font-size="22" font-weight="700" fill="#172033">M</text>
    <circle cx="650" cy="350" r="24" fill="#ffffff" stroke="#8a99aa" stroke-width="3"/>
    <circle cx="650" cy="445" r="24" fill="#1f6feb" stroke="#1556b3" stroke-width="3"/>
    <line x1="650" y1="469" x2="650" y2="498" stroke="#1f6feb" stroke-width="8" stroke-linecap="round"/>
    <text x="650" y="540" font-size="18" font-weight="700" fill="#1f6feb">VCC / 60 Hz</text>
  </g>

  <rect x="800" y="150" width="340" height="420" rx="24" fill="#172033"/>
  <text x="835" y="205" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Studio target</text>
  <text x="835" y="255" font-family="Arial, sans-serif" font-size="20" fill="#d9e2ef">BR1 → VCC</text>
  <text x="835" y="295" font-family="Arial, sans-serif" font-size="20" fill="#d9e2ef">BR0 → GND</text>
  <text x="835" y="335" font-family="Arial, sans-serif" font-size="20" fill="#d9e2ef">Output → 57.6 kbaud</text>
  <text x="835" y="375" font-family="Arial, sans-serif" font-size="20" fill="#d9e2ef">Mode → normal + RAW</text>
  <line x1="835" y1="405" x2="1105" y2="405" stroke="#536174" stroke-width="2"/>
  <text x="835" y="450" font-family="Arial, sans-serif" font-size="20" fill="#d9e2ef">M → VCC = 60 Hz notch</text>
  <text x="835" y="490" font-family="Arial, sans-serif" font-size="20" fill="#d9e2ef">M → GND = 50 Hz notch</text>
  <text x="835" y="535" font-family="Arial, sans-serif" font-size="16" fill="#9fb0c5">Power off before soldering.</text>

  <text x="60" y="615" font-family="Arial, sans-serif" font-size="16" fill="#657184">Diagram is an original documentation aid derived from the TGAM1 configuration table; it is not a board-scale drawing.</text>
</svg>
